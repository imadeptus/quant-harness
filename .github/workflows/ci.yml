name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: quant-harness
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (editable, with dev + api extras)
        run: pip install -e ".[dev,api]"
      - name: Run tests
        run: python -m pytest
      - name: Quickstart example must run (no data)
        run: python examples/quickstart.py
      - name: Audit quickstart example must run (no data)
        run: python examples/audit_quickstart.py
